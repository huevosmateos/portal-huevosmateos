<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Administración - Huevos Mateos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#0d0190;--azul2:#1b16c9;--yema:#f5b301;--txt:#1d1d27;--gris:#6b6b78;--linea:#e7e7ef;--bg:#fafafb;--ok:#1a7a4a;--err:#b91c1c}
*{box-sizing:border-box}
body{margin:0;font-family:'Manrope',system-ui,sans-serif;color:var(--txt);background:var(--bg);line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.15;margin:0 0 .4em}
a{color:inherit;text-decoration:none}
.top{background:#fff;border-bottom:1px solid var(--linea)}
.top-inner{max-width:1180px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:14px}
.logo-img{height:70px;width:auto}
.badge-admin{background:var(--azul);color:#fff;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 12px;border-radius:20px}
.user-box{display:none;align-items:center;gap:12px;font-size:14px;color:var(--gris)}
.user-box b{color:var(--azul)}
.user-box button{background:transparent;border:1px solid var(--linea);color:var(--txt);padding:7px 14px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
.user-box button:hover{border-color:var(--azul);color:var(--azul)}
.nav{background:var(--azul);height:6px}
main{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:40px 20px}

/* LOGIN */
#vista-login{display:flex;justify-content:center;align-items:flex-start;padding-top:30px}
.login-box{background:#fff;border:1px solid var(--linea);border-radius:16px;padding:36px 32px;width:100%;max-width:420px;box-shadow:0 10px 40px rgba(13,1,144,.08)}
.login-box h2{color:var(--azul);font-size:26px}
.login-box p.sub{font-size:14px;color:var(--gris);margin:0 0 22px}
.campo{margin-bottom:16px}
.campo label{display:block;font-size:13px;font-weight:700;color:var(--gris);margin-bottom:5px}
.campo input{display:block;width:100%;padding:11px 13px;border:1px solid var(--linea);border-radius:8px;font-size:15px;font-family:inherit}
.campo input:focus{outline:none;border-color:var(--azul)}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:44px}
.pass-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--gris);font-size:18px;padding:0}
.btn{width:100%;background:var(--azul);color:#fff;border:none;padding:13px;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn:hover{background:var(--azul2)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.msg{display:none;margin-top:14px;padding:10px 14px;border-radius:8px;font-size:13px}
.msg.err{display:block;background:#fdecea;color:var(--err)}
.msg.ok{display:block;background:#e6f9f0;color:var(--ok)}

/* PANEL */
#vista-panel{display:none}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px;padding-bottom:14px;border-bottom:2px solid var(--yema)}
.panel-head h1{font-size:32px;color:var(--azul);margin:0}
.panel-head p{margin:0;color:var(--gris);font-size:14px}
.tabs{display:flex;gap:8px;margin-bottom:18px;align-items:center;flex-wrap:wrap}
.acc-top{display:none;margin-left:auto;gap:10px;flex-wrap:wrap}
.acc-top.on{display:flex}
.tab{background:#fff;border:1px solid var(--linea);color:var(--gris);padding:9px 18px;border-radius:8px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer}
.tab.activo{background:var(--azul);border-color:var(--azul);color:#fff}
.tab:disabled{opacity:.55;cursor:not-allowed}
.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:24px 26px}

/* BUSCADOR */
.buscador-wrap{position:relative}
.buscador-wrap input{width:100%;padding:14px 18px 14px 46px;font-size:16px;border:1px solid var(--linea);border-radius:10px;font-family:inherit;background:#fff}
.buscador-wrap input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(13,1,144,.08)}
.buscador-wrap .lupa{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--gris)}
.info-busq{font-size:13px;color:var(--gris);margin:10px 2px 0}
.resultados{margin-top:14px;border:1px solid var(--linea);border-radius:10px;overflow:hidden;max-height:460px;overflow-y:auto;display:none}
.res{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--linea);cursor:pointer;background:#fff}
.res:last-child{border-bottom:none}
.res:hover,.res.sel{background:#eef0ff}
.res-cod{font-weight:700;color:var(--azul);font-size:14px}
.res-nom{font-weight:700;font-size:14px;line-height:1.3}
.res-fis{font-size:12.5px;color:var(--gris);line-height:1.3}
.res-pob{font-size:12.5px;color:var(--gris);text-align:right;white-space:nowrap}
.vacio{padding:18px;color:var(--gris);font-size:14px;background:#fff}
mark{background:#fff1c2;color:inherit;padding:0 1px;border-radius:2px}

/* FICHA */
#ficha{display:none}
.ficha-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ficha-head h2{color:var(--azul);font-size:26px;margin:0 0 2px}
.ficha-head .fiscal{color:var(--gris);font-size:14px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:#eef0ff;color:var(--azul);margin-right:6px}
.chip.no{background:#fdecea;color:var(--err)}
.chip.si{background:#e6f9f0;color:var(--ok)}
.datos{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.dato{background:var(--bg);border:1px solid var(--linea);border-radius:10px;padding:12px 14px}
.dato .lbl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--gris)}
.dato .val{font-size:15px;font-weight:600;word-break:break-word}
.dato .val a{color:var(--azul)}
.dato .val.vac{color:#a0a0b0;font-weight:500}
.ficha-acc{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.btn-sec{background:#fff;color:var(--azul);border:2px solid var(--azul);padding:11px 20px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-sec:hover{background:#eef0ff}
.btn-pri{background:var(--azul);color:#fff;border:none;padding:13px 22px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-pri:disabled{opacity:.5;cursor:not-allowed}

#vista-cargando{text-align:center;color:var(--gris);padding-top:60px}
.pie{background:var(--azul);color:#cfcffb;text-align:center;font-size:13px;padding:16px}

@media(max-width:600px){
  .logo-img{height:48px}
  .top-inner{flex-wrap:wrap;padding:10px 14px}
  .user-box{width:100%;justify-content:space-between}
  main{padding:22px 12px}
  .login-box{padding:26px 20px}
  .panel-head h1{font-size:24px}
  .tarjeta{padding:16px 14px}
  .resultados{max-height:none;overflow:visible}
  .res{grid-template-columns:52px 1fr;padding:10px 12px}
  .res-pob{grid-column:2;text-align:left}
  .ficha-head h2{font-size:21px}
  .btn-pri,.btn-sec{width:100%}
  .acc-top{margin-left:0;width:100%}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header class="top"><div class="top-inner">
  <div class="logo">
    <a href="index.html"><img src="assets/logo.bmp" alt="Huevos Mateos" class="logo-img"></a>
    <span class="badge-admin">Administración</span>
  </div>
  <div class="user-box" id="user-box">
    <span>Conectado como <b id="user-email"></b></span>

  </div>
</div></header>
<div class="nav"></div>

<main>
  <section id="vista-cargando">Comprobando sesión...</section>

  <!-- LOGIN ADMIN -->
  <section id="vista-login" style="display:none">
    <div class="login-box">
      <h2>Acceso administrador</h2>

      <div class="campo">

  <!-- PANEL ADMIN -->
  <section id="vista-panel">
    <div class="panel-head">
      <div>
        <h1>Pedidos en nombre de cliente</h1>
        <p>Busca el cliente por nombre comercial, razón social o código.</p>
      </div>
    </div>

    <div class="tabs">
      <button class="tab activo" type="button">&#128269; Buscar cliente</button>
      <button class="tab" type="button" disabled title="Próximamente">&#128666; Buscar por ruta</button>
      <div class="acc-top" id="acc-top">
        <button class="btn-pri" type="button" onclick="hacerPedido()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>Hacer pedido para este cliente</button>

    <!-- FICHA DEL CLIENTE SELECCIONADO -->

</main>

<script>
// === SUPABASE (mismo proyecto que el portal) ===
const SUPABASE_URL = 'https://pkwttturncewwdlpxrxz.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBrd3R0dHVybmNld3dkbHB4cnh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTQ1OTEsImV4cCI6MjA5NTczMDU5MX0.aFKZbuO-0zO--SckT-FnjkGdOAV5nBWeEoLgMcV80VY';

// storageKey propio: la sesion del admin NO se mezcla con la de los clientes
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { storageKey: 'hm-admin-auth', persistSession: true, autoRefreshToken: true }
});

var _adminEmail = '';
var CLIENTES = [];        // todos los clientes no bloqueados (cargados una vez)
var _clienteSel = null;   // cliente seleccionado
var MAX_RES = 60;         // maximo de resultados que se pintan

// ---------------- utilidades ----------------
function esc(s){var d=document.createElement('div');d.textContent=(s==null?'':String(s));return d.innerHTML;}
function norm(s){return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9@.]+/g,' ').trim();}
function emailReal(e){
  if(!e) return '';
  if(/^NONE_/i.test(e)) return '';
  var m = /^DUPLICADO_[^_]+_(.+)$/i.exec(e);
  return m ? m[1] : e;
}
function telLink(t){
  if(!t) return '';
  var limpio = String(t).replace(/[^\d+]/g,'');
  return limpio ? '<a href="tel:'+esc(limpio)+'">'+esc(t)+'</a>' : esc(t);
}
// Resalta en el texto las palabras buscadas (sin tener en cuenta acentos)
function resaltar(texto, tokens){
  var t = esc(texto||'');
  if(!tokens.length || !texto) return t;
  var base = norm(texto);
  if(base.length !== String(texto).length) return t; // si no cuadran posiciones, sin resaltado
  var marcas = new Array(texto.length).fill(false);
  tokens.forEach(function(tok){
    var i = base.indexOf(tok);
    while(i >= 0){ for(var k=i;k<i+tok.length;k++) marcas[k]=true; i = base.indexOf(tok, i+tok.length); }
  });
  var out='', dentro=false;
  for(var i=0;i<texto.length;i++){
    if(marcas[i] && !dentro){ out+='<mark>'; dentro=true; }
    if(!marcas[i] && dentro){ out+='</mark>'; dentro=false; }
    out += esc(texto[i]);
  }
  if(dentro) out+='</mark>';
  return out;
}

// ---------------- vistas ----------------
function mostrar(vista){
  document.getElementById('vista-cargando').style.display = vista==='cargando' ? 'block' : 'none';
  document.getElementById('vista-login').style.display    = vista==='login'    ? 'flex'  : 'none';
  document.getElementById('vista-panel').style.display    = vista==='panel'    ? 'block' : 'none';
  document.getElementById('user-box').style.display       = vista==='panel'    ? 'flex'  : 'none';
  if(vista==='login') setTimeout(function(){ var e=document.getElementById('adm-email'); if(e) e.focus(); }, 50);
}
function msgLogin(texto, tipo){
  var m = document.getElementById('msg-login');
  m.className = 'msg ' + (tipo||'err');
  m.textContent = texto;
}
function togglePass(){
  var el = document.getElementById('adm-pass');
  el.type = el.type === 'password' ? 'text' : 'password';
}

// ---------------- login ----------------
async function esAdmin(){
  var r = await sb.rpc('es_admin');
  if(r.error){ console.error(r.error); return false; }
  return r.data === true;
}
async function entrarPanel(user){
  _adminEmail = user.email || '';
  document.getElementById('user-email').textContent = _adminEmail;
  mostrar('panel');
  cargarClientes();
}
async function loginAdmin(){
  var email = (document.getElementById('adm-email').value||'').trim().toLowerCase();
  var pass  = document.getElementById('adm-pass').value || '';
  document.getElementById('msg-login').className = 'msg';
  if(!email || !pass){ msgLogin('Introduce email y contraseña.'); return; }
  var btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Entrando...';
  var res = await sb.auth.signInWithPassword({ email: email, password: pass });
  if(res.error){
    btn.disabled = false; btn.textContent = 'Entrar';
    msgLogin('Email o contraseña incorrectos.');
    return;
  }
  var ok = await esAdmin();
  btn.disabled = false; btn.textContent = 'Entrar';
  if(!ok){
    await sb.auth.signOut();
    msgLogin('Este usuario no tiene permisos de administrador.');
    return;
  }
  document.getElementById('adm-pass').value = '';
  entrarPanel(res.data.user);
}
async function cerrarSesion(){
  try{ sessionStorage.removeItem('hm_admin_cliente'); }catch(e){}
  await sb.auth.signOut();
  _adminEmail = ''; CLIENTES = []; _clienteSel = null;
  document.getElementById('acc-top').classList.remove('on');
  document.getElementById('ficha').style.display = 'none';
  document.getElementById('bloque-buscador').style.display = 'block';
  mostrar('login');
}

// ---------------- carga de clientes ----------------
async function cargarClientes(){
  var info = document.getElementById('info-busq');
  var inp  = document.getElementById('q-cli');
  info.textContent = 'Cargando clientes...';
  var todos = [], desde = 0, lote = 1000;
  while(true){
    var r = await sb.from('clientes')
      .select('codigo,nombre,nombre_comercial,poblacion,telefono,telefono2,telefono3,email,tarifa,tipo_iva,puede_acceder')
      .order('codigo', { ascending: true })
      .range(desde, desde + lote - 1);
    if(r.error){
      info.textContent = 'Error al cargar clientes: ' + r.error.message;
      return;
    }
    todos = todos.concat(r.data || []);
    if(!r.data || r.data.length < lote) break;
    desde += lote;
  }
  CLIENTES = todos.map(function(c){
    c._s = norm([c.codigo, c.nombre_comercial, c.nombre].join(' '));
    return c;
  });
  inp.disabled = false;
  info.textContent = CLIENTES.length + ' clientes disponibles. Escribe al menos 2 letras.';
  if(!CLIENTES.length) info.textContent = 'No se ha recibido ningún cliente. Revisa el permiso del admin en Supabase.';
  inp.focus();
  // Si volvemos de la tienda, reabrir la ficha del cliente con el que estabamos
  var ultimo = null;
  try{ ultimo = sessionStorage.getItem('hm_admin_cliente'); }catch(e){}
  if(ultimo){
    var c = CLIENTES.find(function(x){ return x.codigo === ultimo; });
    if(c) seleccionarCliente(c);
  }
}

// ---------------- buscador ----------------
var _resActual = [], _resIdx = -1;
function buscar(){
  var q = document.getElementById('q-cli').value || '';
  var cont = document.getElementById('resultados');
  var info = document.getElementById('info-busq');
  var tokens = norm(q).split(' ').filter(Boolean);
  _resIdx = -1;

  if(!q.trim() || (tokens.join('').length < 2 && !/^\d+$/.test(q.trim()))){
    cont.style.display = 'none'; cont.innerHTML = '';
    info.textContent = CLIENTES.length + ' clientes disponibles. Escribe al menos 2 letras.';
    _resActual = [];
    return;
  }

  // Todas las palabras deben aparecer (en nombre comercial, razon social o codigo)
  var lista = CLIENTES.filter(function(c){
    for(var i=0;i<tokens.length;i++){ if(c._s.indexOf(tokens[i]) < 0) return false; }
    return true;
  });

  // Orden: primero codigo exacto, luego los que empiezan por lo buscado, luego alfabetico
  var q0 = tokens[0];
  lista.sort(function(a,b){
    var pa = (a.codigo === q.trim().padStart(4,'0')) ? 0 : (norm(a.nombre_comercial).indexOf(q0)===0 || norm(a.nombre).indexOf(q0)===0 ? 1 : 2);
    var pb = (b.codigo === q.trim().padStart(4,'0')) ? 0 : (norm(b.nombre_comercial).indexOf(q0)===0 || norm(b.nombre).indexOf(q0)===0 ? 1 : 2);
    if(pa !== pb) return pa - pb;
    return (a.nombre_comercial||a.nombre||'').localeCompare(b.nombre_comercial||b.nombre||'');
  });

  _resActual = lista.slice(0, MAX_RES);
  info.textContent = lista.length + ' resultado' + (lista.length===1?'':'s') +
    (lista.length > MAX_RES ? ' (se muestran los ' + MAX_RES + ' primeros, afina la búsqueda)' : '');

  if(!lista.length){
    cont.innerHTML = '<div class="vacio">No hay clientes que coincidan.</div>';
    cont.style.display = 'block';
    return;
  }
  cont.innerHTML = _resActual.map(function(c, i){
    var principal = c.nombre_comercial || c.nombre || '(sin nombre)';
    var fiscal = (c.nombre && c.nombre !== principal) ? c.nombre : '';
    return '<div class="res" data-i="'+i+'">'+
      '<span class="res-cod">'+resaltar(c.codigo, tokens)+'</span>'+
      '<div><div class="res-nom">'+resaltar(principal, tokens)+'</div>'+
      (fiscal ? '<div class="res-fis">'+resaltar(fiscal, tokens)+'</div>' : '')+'</div>'+
      '<span class="res-pob">'+esc(c.poblacion||'')+'</span>'+
    '</div>';
  }).join('');
  cont.style.display = 'block';
}
function marcarRes(){
  document.querySelectorAll('#resultados .res').forEach(function(el, i){
    el.classList.toggle('sel', i === _resIdx);
    if(i === _resIdx) el.scrollIntoView({ block: 'nearest' });
  });
}

// ---------------- ficha ----------------
function dato(lbl, valorHtml){
  var vacio = !valorHtml;
  return '<div class="dato"><div class="lbl">'+lbl+'</div><div class="val'+(vacio?' vac':'')+'">'+(vacio?'—':valorHtml)+'</div></div>';
}
function seleccionarCliente(c){
  _clienteSel = c;
  document.getElementById('resultados').style.display = 'none';
  document.getElementById('bloque-buscador').style.display = 'none';

  var principal = c.nombre_comercial || c.nombre || '(sin nombre)';
  var email = emailReal(c.email);
  var tipoIva = {I:'IVA normal', R:'Recargo de equivalencia', E:'Exento'}[c.tipo_iva] || (c.tipo_iva||'');
  var html =
    '<div class="ficha-head">'+
      '<div>'+
        '<h2>'+esc(principal)+'</h2>'+
        (c.nombre && c.nombre!==principal ? '<div class="fiscal">'+esc(c.nombre)+'</div>' : '')+
      '</div>'+
      '<div>'+
        '<span class="chip">Código '+esc(c.codigo)+'</span>'+
        '<span class="chip '+(c.puede_acceder?'si':'no')+'">'+(c.puede_acceder?'Acceso web activo':'Sin acceso web')+'</span>'+
      '</div>'+
    '</div>'+
    '<div class="datos">'+
      dato('Código', esc(c.codigo))+
      dato('Razón social', esc(c.nombre||''))+
      dato('Nombre comercial', esc(c.nombre_comercial||''))+
      dato('Población', esc(c.poblacion||''))+
      dato('Teléfono 1', telLink(c.telefono))+
      dato('Teléfono 2', telLink(c.telefono2))+
      dato('Teléfono 3', telLink(c.telefono3))+
      dato('Email', email ? '<a href="mailto:'+esc(email)+'">'+esc(email)+'</a>' : '')+
      dato('Tarifa', (c.tarifa!=null ? 'Tarifa '+esc(c.tarifa) : ''))+
      dato('Tipo de IVA', esc(tipoIva))+
    '</div>';
  var f = document.getElementById('ficha');
  f.innerHTML = html;
  f.style.display = 'block';
  document.getElementById('acc-top').classList.add('on');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
// Abre la tienda con precios como si este cliente se hubiera logueado
function hacerPedido(){
  if(!_clienteSel) return;
  try{ sessionStorage.setItem('hm_admin_cliente', _clienteSel.codigo); }catch(e){}
  location.href = 'tiendaconprecio.html';
}
function cambiarCliente(){
  _clienteSel = null;
  try{ sessionStorage.removeItem('hm_admin_cliente'); }catch(e){}
  document.getElementById('ficha').style.display = 'none';
  document.getElementById('acc-top').classList.remove('on');
  document.getElementById('bloque-buscador').style.display = 'block';
  var inp = document.getElementById('q-cli');
  inp.focus(); inp.select();
  buscar();
}

// ---------------- eventos ----------------
document.getElementById('adm-email').addEventListener('keydown', function(e){
  if(e.key==='Enter'){ e.preventDefault(); document.getElementById('adm-pass').focus(); }
});
document.getElementById('adm-pass').addEventListener('keydown', function(e){
  if(e.key==='Enter'){ e.preventDefault(); loginAdmin(); }
});
document.getElementById('q-cli').addEventListener('input', buscar);
// En movil: al pulsar la lupa del teclado se cierra el teclado y suben los resultados,
// ocultando la cabecera y dejando el buscador visible arriba
function esMovil(){ return window.innerWidth<=860; }
function subirResultados(){
  var inp=document.getElementById('q-cli');
  document.getElementById('resultados').style.minHeight = (window.innerHeight*0.7)+'px';
  var caja=inp.closest('.buscador-wrap')||inp;
  var y=caja.getBoundingClientRect().top+window.pageYOffset-8;
  window.scrollTo({top:Math.max(0,y),behavior:'smooth'});
}
document.getElementById('q-cli').setAttribute('enterkeyhint','search');
document.getElementById('q-cli').addEventListener('keydown', function(e){
  if(e.key==='Enter'){
    e.preventDefault();
    if(_resIdx >= 0 && _resActual[_resIdx]){ seleccionarCliente(_resActual[_resIdx]); return; }
    if(esMovil()){
      this.blur();                        // cierra el teclado
      setTimeout(subirResultados, 350);   // espera a que el teclado se cierre
      return;
    }
    if(_resActual.length===1) seleccionarCliente(_resActual[0]);
    return;
  }
  if(!_resActual.length) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); _resIdx = Math.min(_resIdx+1, _resActual.length-1); marcarRes(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); _resIdx = Math.max(_resIdx-1, 0); marcarRes(); }
});
document.getElementById('resultados').addEventListener('click', function(e){
  var el = e.target.closest('.res'); if(!el) return;
  seleccionarCliente(_resActual[parseInt(el.getAttribute('data-i'),10)]);
});

sb.auth.onAuthStateChange(function(event){
  if(event === 'SIGNED_OUT') mostrar('login');
});

// Arranque: si ya hay sesion de admin guardada, entrar directamente
(async function(){
  mostrar('cargando');
  var r = await sb.auth.getSession();
  var s = r.data && r.data.session;
  if(s && s.user && await esAdmin()){
    entrarPanel(s.user);
  } else {
    if(s) await sb.auth.signOut();
    mostrar('login');
  }
})();
</script>
